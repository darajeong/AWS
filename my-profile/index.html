<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정다라의 자기소개</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #263238;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f5d0fe);
    }

    .card {
      width: 100%;
      max-width: 620px;
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.15);
    }

    .profile {
      width: 130px;
      height: 130px;
      margin-bottom: 16px;
      object-fit: cover;
      border: 5px solid #e0e7ff;
      border-radius: 50%;
    }

    h1 {
      margin: 8px 0;
      color: #4338ca;
    }

    .intro {
      line-height: 1.8;
    }

    .tags span {
      display: inline-block;
      margin: 5px;
      padding: 8px 13px;
      color: #4338ca;
      background: #eef2ff;
      border-radius: 20px;
    }

    button {
      margin-top: 20px;
      padding: 12px 22px;
      color: white;
      background: #4338ca;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #312e81;
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="profile"
      src="https://placehold.co/300x300?text=ME"
      alt="프로필 이미지"
    >

    <h1>안녕하세요, 정다라입니다!</h1>

    <p class="intro">
      저는 AX 2기 정다라입니다.<br>
      새로운 기술을 배우고 직접 만들어 보는 것을 좋아합니다.<br>
      요즘은 웹 개발과 인공지능에 관심이 있습니다.
    </p>

    <h2>관심 분야</h2>

    <div class="tags">
      <span>웹 개발</span>
      <span>인공지능</span>
      <span>AWS</span>
      <span>여행</span>
    </div>

    <button onclick="showMessage()">눌러보세요</button>
  </main>

  <script>
    function showMessage() {
      alert("제 자기소개 페이지에 와주셔서 감사합니다!");
    }
  </script>
</body>
</html>
